<h1><span lang="EN-GB">Zoom All</span></h1>
<hr align="center" size="5" class="whs3">
<p><span lang="EN-GB">This command is accessible from the</span> <span class="Path" style="font-weight:bold;"><b>viewport context menu &gt; Zoom All</b></span><span lang="EN-GB">, from</span> <span class="Path" style="font-weight:bold;"><b>View &gt; Zoom All</b></span><span lang="EN-GB">, or by pressing</span> <span class="Shortcut" style="font-weight:bold;"><b>A</b></span><span lang="EN-GB">.</span></p>
<p class="description"><span class="Command" style="font-weight:bold;"><b>Description:</b></span> <span class="Command">Zoom All</span> <span lang="EN-GB">command resets the view extents to fit all visible data.</span></p>
