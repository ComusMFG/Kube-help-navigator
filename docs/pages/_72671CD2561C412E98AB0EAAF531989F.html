<h1>Put Label</h1>
<hr align="left" width="100.526%" size="5" class="whs3">
<p><span lang="EN-GB">T</span><span lang="EN-US">he</span> <span lang="EN-US" class="Command">Put Label</span> <span lang="EN-US">command is accessible from the</span> <span lang="EN-US" style="font-weight:bold;"><b>tree context menu for datum entities</b></span> <b><i style="font-style:normal;"><span class="Path" style="font-weight:bold;"><b>&gt; Put Label</b></span></i></b><span lang="EN-US">.</span></p>
<p class="description"><span lang="EN-GB" class="Command" style="font-weight:bold;"><b>Description:</b></span> <span lang="EN-US">This command automatically creates label for each marked datum entity.</span></p>
<p class="bullet"><span lang="EN-US">Labels also can be created interactively, i.e. from the viewport.</span></p>
